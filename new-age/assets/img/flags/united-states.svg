      <circle cx="30" cy="30" r="8"/><circle cx="80" cy="30" r="8"/><circle cx="130" cy="30" r="8"/><circle cx="180" cy="30" r="8"/><circle cx="230" cy="30" r="8"/>
      <circle cx="55" cy="65" r="8"/><circle cx="105" cy="65" r="8"/><circle cx="155" cy="65" r="8"/><circle cx="205" cy="65" r="8"/>
      <circle cx="30" cy="100" r="8"/><circle cx="80" cy="100" r="8"/><circle cx="130" cy="100" r="8"/><circle cx="180" cy="100" r="8"/><circle cx="230" cy="100" r="8"/>
      <circle cx="55" cy="135" r="8"/><circle cx="105" cy="135" r="8"/><circle cx="155" cy="135" r="8"/><circle cx="205" cy="135" r="8"/>
      <circle cx="30" cy="170" r="8"/><circle cx="80" cy="170" r="8"/><circle cx="130" cy="170" r="8"/><circle cx="180" cy="170" r="8"/><circle cx="230" cy="170" r="8"/>
      <circle cx="55" cy="205" r="8"/><circle cx="105" cy="205" r="8"/><circle cx="155" cy="205" r="8"/><circle cx="205" cy="205" r="8"/>
      <circle cx="30" cy="240" r="8"/><circle cx="80" cy="240" r="8"/><circle cx="130" cy="240" r="8"/><circle cx="180" cy="240" r="8"/><circle cx="230" cy="240" r="8"/>
