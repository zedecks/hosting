<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="circleClipUK">
      <circle cx="256" cy="256" r="256"/>
    </clipPath>
    <linearGradient id="glossGradUK" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#circleClipUK)">
    <!-- Blue Base -->
    <rect width="512" height="512" fill="#012169"/>
    
    <!-- White Diagonal Diagonals -->
    <polygon points="0,0 512,512 512,432 80,0" fill="#FFFFFF"/>
    <polygon points="512,0 0,512 0,432 432,0" fill="#FFFFFF"/>
    <polygon points="0,512 512,0 512,80 80,512" fill="#FFFFFF"/>
    <polygon points="512,512 0,0 0,80 432,512" fill="#FFFFFF"/>

    <!-- Red Diagonals (St Patrick / St Andrew) -->
    <polygon points="0,0 256,256 224,256 0,32" fill="#C8102E"/>
    <polygon points="512,512 256,256 288,256 512,480" fill="#C8102E"/>
    <polygon points="512,0 256,256 256,224 480,0" fill="#C8102E"/>
    <polygon points="0,512 256,256 256,288 32,512" fill="#C8102E"/>

    <!-- White Cross (St George outline) -->
    <rect x="206" width="100" height="512" fill="#FFFFFF"/>
    <rect y="206" width="512" height="100" fill="#FFFFFF"/>

    <!-- Red Cross (St George) -->
    <rect x="226" width="60" height="512" fill="#C8102E"/>
    <rect y="226" width="512" height="60" fill="#C8102E"/>

    <!-- Subtle Gloss Overlay for Flaticon badge feel -->
    <ellipse cx="256" cy="128" rx="230" ry="110" fill="url(#glossGradUK)"/>
  </g>
</svg>
